  <style>
    :root {
      --bg: #d9e1e4;
      --fg: #2b2d2e;
      --muted: #5c6467;
      --link: #254b8f;
      --my: #254b8f;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: rgba(37, 75, 143, 0.12); }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Satoshi, -apple-system, "system-ui", "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    main {
      position: relative;
      z-index: 1;
      padding: 96px 72px 48px;
      padding-left: max(72px, env(safe-area-inset-left));
      max-width: 520px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 42px;
      font-weight: 300;
      letter-spacing: -0.01em;
      line-height: 1.6;
    }
    h2 {
      margin: 0 0 24px;
      font-size: 20px;
      font-weight: 300;
      line-height: 1.6;
      color: var(--muted);
    }
    ul { list-style: none; margin: 24px 0 0; padding: 0; }
    li { margin: 0; }
    a { display: inline-block; padding: 5px 0; color: var(--link); text-decoration: none; }
    a:active { opacity: 0.6; }
    a .my { color: var(--my); }
    a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }

    /* Photo: large, bottom-right, feathered into the background */
    .photo {
      position: fixed;
      right: -7vw;
      bottom: 0;
      height: 100vh;
      height: 100svh;
      width: auto;
      max-width: 100vw;
      z-index: 0;
      pointer-events: none;
      -webkit-mask-image:
        linear-gradient(to right, transparent 0, #000 22%),
        linear-gradient(to bottom, transparent 0, #000 14%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent 0, #000 22%),
        linear-gradient(to bottom, transparent 0, #000 14%);
      mask-composite: intersect;
    }

    @media (max-height: 520px) {
      main { padding-top: 28px; padding-bottom: 16px; }
      h1 { font-size: 34px; line-height: 1.4; margin-bottom: 0; }
      h2 { margin-bottom: 8px; line-height: 1.4; }
      ul { margin-top: 4px; }
      a { padding: 9px 0; }
    }

    @media (max-width: 800px) {
      main { padding: 56px 36px 0; padding-left: max(36px, env(safe-area-inset-left)); }
      h1 { font-size: 36px; }
      a { font-size: 17px; padding: 9px 0; }
      .photo {
        position: fixed;
        right: 0;
        bottom: 0;
        height: 62vh;
        height: 62svh;
        width: 100%;
        max-width: none;
        object-fit: cover;
        object-position: 62% bottom;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
      }
    }
  </style>
